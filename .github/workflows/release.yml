name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: bash scripts/build-release-assets.sh
        env:
          POSTIZER_RELEASE_VERSION: ${{ github.ref_name }}
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/postizer-${{ github.ref_name }}-linux-amd64.tar.gz
            dist/release/postizer-${{ github.ref_name }}-linux-arm64.tar.gz
            dist/release/SHA256SUMS

  docker:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            POSTIZER_VERSION=${{ github.ref_name }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/postizer:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/postizer:latest
